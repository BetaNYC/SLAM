[project]
name = "slam-pipeline"
version = "0.1.0"
description = "SLAM v2 prototype data pipeline: NYC + NYS open data -> static JSON for the site"
requires-python = ">=3.11,<3.16"
dependencies = [
    "duckdb>=2.0,<3",
    "truststore>=0.10,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
